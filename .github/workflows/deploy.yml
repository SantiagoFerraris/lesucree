name: Build

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck application
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Run unit tests
        run: npm test
      - name: Build production assets
        run: npm run build
